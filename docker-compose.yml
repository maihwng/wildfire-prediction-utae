services:
  wildfire-prediction:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-maithithuhuong}/wildfire-prediction-utae:latest
    container_name: wildfire-prediction-app
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=7860
    volumes:
      - ./data/processed_v1:/app/data/processed_v1:ro
      - ./checkpoints:/app/checkpoints:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

