
name: Wildfire UTAE CI-CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =====================================
  # JOB 1: CONTINUOUS INTEGRATION
  # =====================================

  test:
    name: Test Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest spaces

      - name: Check Python syntax
        run: |
          python -m compileall -q app.py src

      - name: Check dependencies
        run: |
          python -m pip check

      - name: Run unit tests
        shell: bash
        run: |
          if [ -d tests ] && \
             find tests -type f -name "test_*.py" \
             -print -quit | grep -q .; then
            python -m pytest -q tests
          else
            echo "::warning::No unit tests found."
            echo "Only syntax and dependency checks were performed."
          fi

  # =====================================
  # JOB 2: BUILD AND PUBLISH DOCKER IMAGE
  # =====================================

  docker:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    needs: test

    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.MAITHITHUHUONG }}/wildfire-prediction-utae
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.MAITHITHUHUONG }}
          password: ${{ secrets.MAITHITHUHUONG }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
