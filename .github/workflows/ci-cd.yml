name: Wildfire Prediction UTAE CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =========================================================================
  # GIAI ĐOẠN 1: CONTINUOUS INTEGRATION (CI) - KIỂM THỬ MÔ HÌNH VÀ PIPELINE
  # =========================================================================
  test:
    name: Test & Validate AI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov spaces

      - name: Check Python syntax
        run: |
          python -m compileall -q app.py src tests

      - name: Run unit & integration tests
        run: |
          python -m pytest tests -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml

  # =========================================================================
  # GIAI ĐOẠN 2: CONTINUOUS DELIVERY (CD) - BUILD VÀ PUBLISH DOCKER IMAGE
  # =========================================================================
  docker:
    name: Build & Publish Docker Image to Docker Hub
    runs-on: ubuntu-latest
    needs: test
    # Chỉ push image khi push vào nhánh main hoặc kích hoạt workflow_dispatch thủ công
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'maithithuhuong' }}/wildfire-prediction-utae
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'maithithuhuong' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || secrets.MAITHITHUHUONG }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
